name: Update MedTech signals

on:
  schedule:
    # Two runs during European trading (for Siemens Healthineers on Xetra): 9:40 and 11:40 UTC
    - cron: "40 9,11 * * 1-5"
    # Every hour at :40 past, 13:40–21:40 UTC: US market hours all year, plus one run after the close
    - cron: "40 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto, intraday or summary (summary = after-close run)"
        default: auto
  push:
    branches: [main]
    paths: ["app/**", "docs/*.html", "docs/*.js", "docs/*.css", "config.yaml", "data/**", "requirements.txt"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: medtech-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch data and analyze
        run: python -m app.run --mode "${{ github.event.inputs.mode || 'auto' }}"

      - name: Save history (signals, IV history, earnings) back to the repo
        run: |
          git config user.name "medtech-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if ! git diff --cached --quiet; then
            git commit -m "Update MedTech data $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase -X ours origin main || true
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
